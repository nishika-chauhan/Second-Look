services:
  simulator:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "uvicorn", "sim.simulator_service:app", "--host", "0.0.0.0", "--port", "8001"]
    expose:
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "uvicorn", "ai.server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      SIMULATOR_URL: "http://simulator:8001"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-*}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      NEBIUS_API_KEY: "${NEBIUS_API_KEY:-}"
    depends_on:
      simulator:
        condition: service_healthy
